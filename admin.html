<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions Dashboard | Ruh Al Quran Academy</title><style>:root{font-family:Arial,sans-serif;color:#17382f;background:#f7f5ee}*{box-sizing:border-box}body{margin:0}header{background:#103d35;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:25px}main{max-width:1100px;margin:30px auto;padding:0 20px}.panel{background:white;border:1px solid #e4e7df;border-radius:12px;padding:22px;margin:20px 0;box-shadow:0 6px 20px #0000000a}input,select,button{font:inherit;padding:11px;border-radius:6px;border:1px solid #cbd5cf}button{background:#103d35;color:white;cursor:pointer;border:0}button:hover{background:#205c4f}label{display:block;margin-bottom:8px;font-weight:700}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:180px}#msg{color:#8b2c23}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e9eee9;vertical-align:top}th{background:#f2f6f1}td{overflow-wrap:anywhere}select{max-width:190px}.scroll{overflow-x:auto}.muted{color:#66756e;font-size:13px}.stats{font-size:20px;font-weight:700}a{color:#103d35}#dashboard[hidden],#login[hidden]{display:none}</style></head><body><header><h1>Ruh Al Quran Academy</h1><div>Private Admissions Dashboard</div></header><main><section id="login" class="panel"><h2>Administrator sign in</h2><form id="loginForm"><label for="password">Admin password</label><div class="row"><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></div></form><p class="muted">Only authorized academy staff should access this page.</p></section><section id="dashboard" hidden><div class="row" style="justify-content:space-between"><h2>Student inquiries</h2><button id="logout">Sign out</button></div><div class="panel"><div class="stats" id="stats">—</div><p class="muted">Latest 1,000 applications · Data is stored on the server</p><div class="row"><input id="search" placeholder="Search student, email or course" aria-label="Search applications"><select id="filter" aria-label="Filter by status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Trial Scheduled</option><option>Enrolled</option><option>Closed</option></select><button id="refresh">Refresh</button></div></div><div class="panel scroll"><table><thead><tr><th>Received</th><th>Student</th><th>Course</th><th>Contact</th><th>Notes</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="msg" role="status"></p><p><a href="/">← Back to academy website</a></p></main><script>
let csrf='',apps=[];const $=id=>document.getElementById(id);async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},...options});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
async function init(){try{const s=await api('/api/session');csrf=s.csrf||'';$('login').hidden=s.authenticated;$('dashboard').hidden=!s.authenticated;if(s.authenticated)await load()}catch(e){$('msg').textContent=e.message}}
async function load(){try{apps=(await api('/api/applications')).applications;render();$('msg').textContent=''}catch(e){$('msg').textContent=e.message}}
function node(tag,text){const n=document.createElement(tag);n.textContent=text??'';return n}
function render(){const q=$('search').value.toLowerCase(),status=$('filter').value;const filtered=apps.filter(a=>(!status||a.status===status)&&[a.name,a.email,a.course,a.phone].join(' ').toLowerCase().includes(q));$('stats').textContent=`${apps.length} applications · ${apps.filter(a=>a.status==='New').length} new`;const body=$('rows');body.replaceChildren();for(const a of filtered){const tr=document.createElement('tr');tr.append(node('td',a.created_at+' UTC'));tr.append(node('td',a.name));tr.append(node('td',a.course));const contact=document.createElement('td');contact.append(node('div',a.email),node('div',a.phone),node('div',a.timezone));tr.append(contact);tr.append(node('td',a.message));const td=document.createElement('td'),sel=document.createElement('select');for(const s of ['New','Contacted','Trial Scheduled','Enrolled','Closed']){const op=node('option',s);op.value=s;sel.append(op)}sel.value=a.status;sel.addEventListener('change',async()=>{try{await api('/api/status',{method:'POST',body:JSON.stringify({id:a.id,status:sel.value})});a.status=sel.value;render()}catch(e){$('msg').textContent=e.message;sel.value=a.status}});td.append(sel);tr.append(td);body.append(tr)}if(!filtered.length){const tr=document.createElement('tr'),td=node('td','No applications match your search.');td.colSpan=6;tr.append(td);body.append(tr)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await init()}catch(err){$('msg').textContent=err.message}});$('logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});csrf='';await init()};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;init();
</script></body></html>
